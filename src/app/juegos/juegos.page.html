<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="primary">
      <ion-menu-button menu="administration"></ion-menu-button>
    </ion-buttons>
    <ion-title>Juegos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="app-page">
  @if (loading) {
    <section class="app-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando catalogo...</p>
    </section>
  }
  @if (errorMessage) {
    <section class="app-state">
      <p>{{ errorMessage }}</p>
      <ion-button (click)="listadoJuegos()">Reintentar</ion-button>
    </section>
  }
  @if (!loading && !errorMessage) {
    <section class="game-grid app-container">
      @for (item of juegos; track item.id) {
        <app-game-card
          [game]="item"
          [favorite]="isFavorite(item.id)"
          [expanded]="isExpanded(item.id)"
          (favoriteToggle)="fav(item)"
          (expandedToggle)="toggleMore(item.id)">
        </app-game-card>
      }
    </section>
  }

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando mas juegos...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<app-tabs mode="user"></app-tabs>
