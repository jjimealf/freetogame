<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
    </ion-buttons>
    <ion-title>Administracion</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-title color="light" class="ion-margin">Nº de juegos por categorias</ion-title>
  @if (loading) {
    <section class="chart-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando datos...</p>
    </section>
  }
  @if (errorMessage) {
    <section class="chart-state">
      <p>{{ errorMessage }}</p>
    </section>
  }
  @if (!loading && !errorMessage) {
      <div class="chart">
        <canvas baseChart
                [datasets]="pieChartData" 
                [labels]="pieChartLabels" 
                [type]="pieChartType"
                [options]="pieChartOptions"
                [plugins]="pieChartPlugins"
                [legend]="pieChartLegend">
        </canvas>
      </div>
  }
</ion-content>

<app-tabs mode="admin"></app-tabs>
