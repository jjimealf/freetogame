<ion-header>
  <ion-toolbar color = "primary">
    <ion-title>INICIO SESION</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-card >  
    <ion-card-content > 
      <form [formGroup] = "formularioLogin" >
        <ion-item lines="full" color="dark">
          <ion-label position="floating">Email</ion-label>
          <ion-input formControlName = "email" type="text" required></ion-input>
        </ion-item>
    
        <ion-item lines="full" color="dark">
          <ion-label position="floating">Password</ion-label>
          <ion-input formControlName = "password" type="password" required></ion-input>
        </ion-item>
      <br>
        <ion-row>
          <ion-col>
            <ion-button (click)="login()" type="submit" color="primary" expand="block">LOGUEAR</ion-button>
          </ion-col>
        </ion-row>
      </form>
    </ion-card-content>
  </ion-card>
  <div align="center">
      <ion-label color="light">
        Si no estas registrado 
      </ion-label>
      <ion-text [routerLink]="['/registro']" color="primary">Registrate</ion-text>
  </div>
</ion-content>
