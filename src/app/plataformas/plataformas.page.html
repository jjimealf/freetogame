<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="primary">
      <ion-menu-button menu="administration"></ion-menu-button>
    </ion-buttons>
    <ion-title>Plataformas</ion-title>
  </ion-toolbar>
  <ion-segment (ionChange)="segmentChanged($event)" value="pc">
    <ion-segment-button value="pc">
      <ion-label color="light">PC (Windows)</ion-label>
    </ion-segment-button>
    <ion-segment-button value="browser">
      <ion-label color="light">Web Browser</ion-label>
    </ion-segment-button>
  </ion-segment>
</ion-header>

<ion-content class="app-page">
  @if (loading) {
    <section class="app-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando juegos...</p>
    </section>
  }
  @if (errorMessage) {
    <section class="app-state">
      <p>{{ errorMessage }}</p>
    </section>
  }
  @if (!loading && !errorMessage) {
    <section class="game-grid app-container">
      @for (item of juegos; track item.id) {
        <app-game-card
          [game]="item"
          [showFavoriteAction]="false"
          [expanded]="isExpanded(item.id)"
          (expandedToggle)="toggleMore(item.id)">
        </app-game-card>
      }
    </section>
  }
</ion-content>

<app-tabs mode="user"></app-tabs>
