<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="primary">
      <ion-menu-button menu="administration">
      </ion-menu-button>
    </ion-buttons>
    <ion-title>Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-label *ngIf="juegosFav == null || juegosFav.length == 0">
    <ion-title color="light">No tienes juegos favoritos</ion-title>
  </ion-label>
  <ion-list *ngIf="juegosFav != null">
    <ion-item *ngFor="let item of juegosFav, let i = index"> 
      <ion-card color="primary">
        <ion-item color="primary">
          <ion-thumbnail slot="start">
            <img src="{{item.thumbnail}}">
          </ion-thumbnail>
          <ion-icon *ngIf="isFav[i] === true" (click)="fav(i)" slot="end" name="heart"></ion-icon>
          <ion-icon *ngIf="isFav[i] === false" (click)="fav(i)" slot="end" name="heart-outline"></ion-icon>
          <ion-card-header>
            <ion-card-title>{{item.title}}</ion-card-title>
          </ion-card-header>
        </ion-item>
        <ion-card-content>
          <p *ngIf="isFull[i] === true">{{item.short_description}} <span style="color: #222428" (click)="toggleMore(i)">... ver menos</span></p>
          <p *ngIf="isFull[i] === false">{{item.short_description | filtro :10}} <span style="color: #222428" (click)="toggleMore(i)">... ver mas</span></p>
          <p>Desarrolladora: {{item.developer}}</p>
          <ion-label>Plataformas:
            <ion-grid>
              <ion-row>
                  <ion-col size="2" >
                    <ion-icon *ngIf="item.platform === 'PC (Windows)' " name="logo-windows"></ion-icon>
                  </ion-col>
                  <ion-col size="2" >
                    <ion-icon *ngIf="item.platform === 'Web Browser' " name="browsers-outline"></ion-icon>
                  </ion-col>
              </ion-row>
              <ion-row *ngIf="item.platform === 'PC (Windows), Web Browser'"> 
                <ion-col size="2" >
                  <ion-icon name="logo-windows"></ion-icon>
                </ion-col>
                <ion-col size="2" >
                  <ion-icon name="browsers-outline"></ion-icon>
                </ion-col>
            </ion-row>
          </ion-grid>
          </ion-label>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-tab-bar>
   <ion-tabs>
    <ion-tab-bar slot="bottom" color="primary">
      <ion-tab-button [routerLink]="['/juegos']">
        <ion-icon name="game-controller-outline"></ion-icon>
        <ion-label>Juegos</ion-label>
      </ion-tab-button>
      
      <ion-tab-button [routerLink]="['/plataformas']">
        <ion-icon name="rocket-outline"></ion-icon>
        <ion-label>Plataformas</ion-label>
      </ion-tab-button>
  
      <ion-tab-button [routerLink]="['/favoritos']">
        <ion-icon name="heart-outline"></ion-icon>
        <ion-label>Favoritos</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-tab-bar>
</ion-footer>
