<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="primary">
      <ion-menu-button menu="administration"></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Favoritos
      <ion-button fill="clear" class="cart-button" [disabled]="carrito.length === 0" (click)="pedido()">
        <ion-icon [name]="carrito.length === 0 ? 'cart-outline' : 'cart'"></ion-icon>
        <ion-badge color="secondary">{{ carrito.length }}</ion-badge>
      </ion-button>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="app-page">
  @if (favoritos.length === 0) {
    <section class="app-state">
      <ion-icon name="heart-outline"></ion-icon>
      <h2>No tienes juegos favoritos</h2>
      <p>Marca juegos desde el catalogo para guardarlos en tu cuenta.</p>
    </section>
  }
  @if (favoritos.length > 0) {
    <section class="game-grid app-container">
      @for (item of favoritos; track item.id) {
        <app-game-card
          [game]="item"
          [favorite]="true"
          [showCartAction]="true"
          [expanded]="isExpanded(item.id)"
          (favoriteToggle)="fav(item)"
          (cartAdd)="add(item)"
          (expandedToggle)="toggleMore(item.id)">
        </app-game-card>
      }
    </section>
  }
</ion-content>

<app-tabs mode="user"></app-tabs>
