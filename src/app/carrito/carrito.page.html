<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Pedido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (carrito.length === 0) {
    <ion-item>
      <ion-label color="light">
        No hay ningún juego en el pedido actual
      </ion-label>
    </ion-item>
  }
  @if (carrito.length > 0) {
    <ion-list>
      @for (item of carrito; track item) {
        <ion-item>
          <ion-thumbnail slot="start">
            <img src="{{item.thumbnail}}">
          </ion-thumbnail>
          <ion-label color="light">{{item.title}}</ion-label>
        </ion-item>
      }
    </ion-list>
  }
  <ion-button color="primary" [disabled]="carrito.length === 0" (click)="realizarPedido()">Pedir</ion-button>
  <ion-button color="primary" [disabled]="!pdfObj" (click)="enviarPedido()">Enviar Pedido</ion-button>
</ion-content>
