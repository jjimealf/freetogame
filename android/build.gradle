// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Enable Gradle to automatically download a matching Java toolchain when not present.
// This helps resolve: "Cannot find a Java installation... Toolchain download repositories have not been configured." on CI/Windows.
gradle.startParameter.systemPropertiesArgs.put('org.gradle.java.installations.auto-download', 'true')

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
